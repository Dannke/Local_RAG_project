[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-project"
version = "0.1.0"
description = "A Python project skeleton for local Retrieval-Augmented Generation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Local RAG Project" }]
dependencies = [
    "faiss-cpu>=1.8",
    "httpx>=0.28",
    "numpy>=1.26",
    "openai>=1.0",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
    "streamlit>=1.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
providers = []

[project.scripts]
rag-project = "rag_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
